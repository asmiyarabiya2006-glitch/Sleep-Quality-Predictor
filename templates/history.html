<!DOCTYPE html>
<html>
<head>
    <title>Past Predictions</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #dbe7ff, #e6dcff);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }
        .card {
            max-width: 700px;
            margin: 30px auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(100, 80, 180, 0.2);
        }
        h1 { color: #4b3f9e; text-align: center; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { background: #6c5ce7; color: white; padding: 10px; }
        td { padding: 10px; text-align: center; border-bottom: 1px solid #e6e3fa; }
        a { color: #6c5ce7; font-weight: 600; text-decoration: none; }
        .back { text-align: center; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>📈 Past Predictions</h1>

        {% if rows %}
        <table>
            <canvas id="sleepChart" style="margin-top:30px;"></canvas>

        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <script>
            const rows = {{ rows | tojson }}.slice().reverse();
            const labels = rows.map(r => r["Date"]);
            const sleep = rows.map(r => parseFloat(r["Sleep Duration"]));
            const stress = rows.map(r => parseFloat(r["Stress"]));

            new Chart(document.getElementById("sleepChart"), {
                type: "line",
                data: {
                    labels: labels,
                    datasets: [
                        {label: "Sleep (hrs)", data: sleep, borderColor: "#6c5ce7", backgroundColor: "#6c5ce7", tension: 0.3},
                        {label: "Stress (0-10)", data: stress, borderColor: "#e17055", backgroundColor: "#e17055", tension: 0.3}
                    ]
                }
            });
        </script>
            <tr>
                <th>Date</th>
                <th>Sleep (hrs)</th>
                <th>Exercise (min)</th>
                <th>Stress</th>
                <th>Result</th>
            </tr>
            {% for row in rows %}
            <tr>
                <td>{{ row["Date"] }}</td>
                <td>{{ row["Sleep Duration"] }}</td>
                <td>{{ row["Exercise"] }}</td>
                <td>{{ row["Stress"] }}</td>
                <td><b>{{ row["Result"] }}</b></td>
            </tr>
            {% endfor %}
        </table>
        {% else %}
        <p style="text-align:center;">No predictions yet.</p>
        {% endif %}

        <p class="back"><a href="/">← Back to predictor</a></p>
    </div>
</body>
</html>
